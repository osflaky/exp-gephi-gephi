name: build

on:
  workflow_dispatch:
jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 17
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-17-arm64
    runs-on: ${{ matrix.runner }}
    env:
      MAVEN_OPTS: "-Djava.awt.headless=true"
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5.7.0
      with:
        java-version: '${{ matrix.java }}'
          # Temurin publishes no JDK 17 for Windows on ARM64; Microsoft Build of OpenJDK does
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'microsoft' || 'temurin' }}
        cache: 'maven'
    - name: Build project with Maven
      run: mvn -T 4 --batch-mode verify -P enableCheckStyle
    name: build_and_test [${{ matrix.expander_leg }}]
    timeout-minutes: 150
